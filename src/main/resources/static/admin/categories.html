<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>分类管理 - 外卖订餐管理端</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <header class="topbar">
      <span class="page-title" id="pageTitle">分类管理</span>
      <div class="topbar-right">
        <span class="admin-name" id="adminName"></span>
        <button type="button" class="btn btn-sm" id="logoutBtn">退出登录</button>
      </div>
    </header>

    <div class="content">
      <div class="card">
        <div class="card-header">
          <h3>菜品分类列表</h3>
          <button type="button" class="btn btn-primary" id="addBtn">+ 新增分类</button>
        </div>
        <div class="table-wrap">
          <table class="table">
            <thead>
            <tr>
              <th>ID</th>
              <th>分类名称</th>
              <th>排序号</th>
              <th>状态</th>
              <th>操作</th>
            </tr>
            </thead>
            <tbody id="tableBody">
            <tr><td colspan="5" class="empty-cell">加载中...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 新增/编辑分类弹窗 -->
<div class="modal-mask" id="editModal">
  <div class="modal modal-sm">
    <div class="modal-header">
      <h3 id="modalTitle">新增分类</h3>
      <button type="button" class="modal-close" data-close>&times;</button>
    </div>
    <div class="modal-body">
      <form id="editForm" autocomplete="off">
        <div class="form-item">
          <label><span class="required">*</span>分类名称</label>
          <input type="text" id="fName" class="form-input" placeholder="如：热菜、饮品" maxlength="20">
        </div>
        <div class="form-item">
          <label>排序号</label>
          <input type="number" id="fSortOrder" class="form-input" placeholder="数值越小越靠前" value="0">
        </div>
        <div class="form-item">
          <label>状态</label>
          <select id="fStatus" class="form-select">
            <option value="1">启用</option>
            <option value="0">禁用</option>
          </select>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn" data-close>取消</button>
      <button type="button" class="btn btn-primary" id="saveBtn">保存</button>
    </div>
  </div>
</div>

<script src="js/admin-common.js"></script>
<script>
  (function () {
    var editingId = null; // null=新增

    initAdminPage('categories', '分类管理').then(function () {
      loadList();
    }).catch(function () {});

    bindModalClose();

    /** 加载分类列表（全量，无分页） */
    function loadList() {
      apiGet('/api/admin/categories').then(function (list) {
        renderTable(list || []);
      }).catch(function () {});
    }

    /** 渲染表格 */
    function renderTable(list) {
      var tbody = document.getElementById('tableBody');
      if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty-cell">暂无分类数据</td></tr>';
        return;
      }
      tbody.innerHTML = list.map(function (c) {
        var statusBadge = c.status === 1
          ? '<span class="badge badge-success">启用</span>'
          : '<span class="badge badge-gray">禁用</span>';
        return '<tr>' +
          '<td>' + c.id + '</td>' +
          '<td>' + escapeHtml(c.name) + '</td>' +
          '<td>' + (c.sortOrder != null ? c.sortOrder : '-') + '</td>' +
          '<td>' + statusBadge + '</td>' +
          '<td><div class="btn-group-row">' +
          '  <button type="button" class="btn btn-sm" data-id="' + c.id + '" data-act="edit">编辑</button>' +
          '  <button type="button" class="btn btn-sm btn-outline-danger" data-id="' + c.id + '" data-act="del">删除</button>' +
          '</div></td>' +
          '</tr>';
      }).join('');

      tbody.querySelectorAll('[data-act]').forEach(function (el) {
        var id = Number(el.getAttribute('data-id'));
        var row = list.find(function (r) { return r.id === id; });
        if (el.getAttribute('data-act') === 'edit') {
          el.addEventListener('click', function () { openEdit(row); });
        } else {
          el.addEventListener('click', function () {
            confirmDialog('确定删除分类「' + row.name + '」吗？\n若该分类下仍有菜品，删除将被拒绝。').then(function (ok) {
              if (!ok) return;
              // 后端会校验分类下有无菜品，失败时统一 toast 展示后端 msg
              apiDelete('/api/admin/categories/' + id).then(function () {
                toast('删除成功', 'success');
                loadList();
              }).catch(function () { });
            });
          });
        }
      });
    }

    /** 打开新增弹窗 */
    document.getElementById('addBtn').addEventListener('click', function () {
      editingId = null;
      document.getElementById('modalTitle').textContent = '新增分类';
      document.getElementById('fName').value = '';
      document.getElementById('fSortOrder').value = '0';
      document.getElementById('fStatus').value = '1';
      openModal('editModal');
    });

    /** 打开编辑弹窗 */
    function openEdit(row) {
      editingId = row.id;
      document.getElementById('modalTitle').textContent = '编辑分类';
      document.getElementById('fName').value = row.name;
      document.getElementById('fSortOrder').value = row.sortOrder != null ? row.sortOrder : 0;
      document.getElementById('fStatus').value = String(row.status);
      openModal('editModal');
    }

    /** 保存 */
    document.getElementById('saveBtn').addEventListener('click', function () {
      var name = document.getElementById('fName').value.trim();
      if (!name) { toast('请输入分类名称', 'error'); return; }
      var body = {
        name: name,
        sortOrder: parseInt(document.getElementById('fSortOrder').value, 10) || 0,
        status: parseInt(document.getElementById('fStatus').value, 10)
      };
      var req = editingId === null
        ? apiPost('/api/admin/categories', body)
        : apiPut('/api/admin/categories/' + editingId, body);
      req.then(function () {
        toast(editingId === null ? '新增成功' : '修改成功', 'success');
        closeModal('editModal');
        loadList();
      }).catch(function () { });
    });
  })();
</script>
</body>
</html>
