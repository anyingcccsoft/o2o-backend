# 开发环境：H2 内存库（MySQL 兼容模式），免安装即可运行演示
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:o2o;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
      data-locations: classpath:data.sql
      encoding: UTF-8
  h2:
    console:
      enabled: true
      path: /h2-console
