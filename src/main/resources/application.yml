spring:
  profiles:
    active: dev
  web:
    resources:
      cache:
        cachecontrol:
          # 静态页面/JS 每次使用前向服务端验证新鲜度，避免浏览器启发式缓存旧资源
          no-cache: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  servlet:
    session:
      timeout: 30m

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

# 自定义配置：图片上传目录（WebConfig 将 /upload/** 映射到该本地目录）
o2o:
  upload-dir: ./upload/

logging:
  level:
    root: info
    com.shangda.o2o: debug
